const KEY='egner-inventur-nm2025-v1';
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){state={}}
const $=id=>document.getElementById(id);
function getItem(p){return state[p.pos]||{quality:p.quality,pakete:'',schichten:'',stueck:'',lager:''}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Automatisch gespeichert · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}catch(e){$('saved').textContent='Lokale Speicherung nicht verfügbar – bitte Daten zeitnah als PDF sichern.'}}
function update(pos,key,value){const p=PRODUCTS.find(x=>x.pos===pos);state[pos]={...getItem(p),...state[pos],[key]:value};save()}
function render(){const q=$('search').value.trim().toLocaleLowerCase('de');const selected=$('listFilter').value;const list=PRODUCTS.filter(p=>(q!==''||(selected==='alle'||p.list===selected))&&(p.article+' '+p.description+' '+p.quality).toLocaleLowerCase('de').includes(q));$('count').textContent=`${list.length} Treffer · ${PRODUCTS.length} insgesamt`;$('empty').hidden=!!list.length;$('cards').innerHTML=list.map(p=>{const v=getItem(p);return `<article class="item"><div class="itemhead"><div><div class="pos">Liste ${esc(p.list)} · Position ${p.listPos}</div><div class="article">${esc(p.article)}</div></div><span class="pill">${esc(v.quality||p.quality)}</span></div><div class="desc">${esc(p.description)}</div><div class="pack">Verpackungseinheit: <strong>${esc(p.pack||'Keine Angabe in der PDF')}</strong></div><div><label class="qualitylabel" for="q-${p.pos}">Qualität</label><select id="q-${p.pos}" data-pos="${p.pos}" data-key="quality"><option ${v.quality==='1. Wahl'?'selected':''}>1. Wahl</option><option ${v.quality==='2. Wahl'?'selected':''}>2. Wahl</option></select></div><div class="fields" style="margin-top:9px">${[['pakete','Pakete'],['schichten','Schichten'],['stueck','Stück']].map(([k,l])=>`<label>${l}<input inputmode="numeric" type="number" min="0" step="1" data-pos="${p.pos}" data-key="${k}" value="${esc(v[k])}" placeholder="0" aria-label="${l}, Position ${p.pos}"></label>`).join('')}</div><div class="bottomfields"><div><label class="lagerlabel" for="l-${p.pos}">Lagerplatz</label><select id="l-${p.pos}" data-pos="${p.pos}" data-key="lager"><option value="" ${!v.lager?'selected':''}>Auswählen</option>${['A','B','C'].map(x=>`<option ${v.lager===x?'selected':''}>${x}</option>`).join('')}</select></div><div style="display:flex;align-items:end"><span class="saveinfo">Änderungen werden automatisch gespeichert.</span></div></div></article>`}).join('')}
$('cards').addEventListener('input',e=>{const el=e.target;if(el.dataset.pos&&el.dataset.key){update(Number(el.dataset.pos),el.dataset.key,el.value)}});
$('cards').addEventListener('change',e=>{const el=e.target;if(el.dataset.pos&&el.dataset.key){update(Number(el.dataset.pos),el.dataset.key,el.value);renderPreserveFocus(el)}});
function renderPreserveFocus(el){if(el.dataset.key==='quality'||el.dataset.key==='lager'){const pos=el.dataset.pos,key=el.dataset.key;render();const n=document.querySelector(`[data-pos="${pos}"][data-key="${key}"]`);if(n)n.focus()}}
$('search').addEventListener('input',render);$('listFilter').addEventListener('change',render);$('clearSearch').onclick=()=>{$('search').value='';render();$('search').focus()};
function buildPrint(){const rows=PRODUCTS.map(p=>{const v=getItem(p);return `<tr><td>${esc(p.list)} · ${p.listPos}</td><td>${esc(p.article)}</td><td>${esc(p.description)}</td><td>${esc(v.quality||p.quality)}</td><td>${esc(p.pack||'—')}</td><td>${esc(v.pakete)}</td><td>${esc(v.schichten)}</td><td>${esc(v.stueck)}</td><td>${esc(v.lager)}</td></tr>`}).join('');$('printArea').innerHTML=`<h1 class="print-title">Egner Inventur – NM 2025 Produktion</h1><div class="print-sub">Sechs Inventurlisten · ${PRODUCTS.length} Positionen · Exportdatum: ${new Date().toLocaleDateString('de-DE')}</div><table class="print-table"><thead><tr><th>Liste / Pos.</th><th>Artikelnummer</th><th>Beschreibung</th><th>Qualität</th><th>Verpackung</th><th>Pakete</th><th>Schichten</th><th>Stück</th><th>Lagerplatz</th></tr></thead><tbody>${rows}</tbody></table>`}
$('export').onclick=()=>{save();buildPrint();window.print()};$('reset').onclick=()=>{if(confirm('Alle lokal gespeicherten Mengen, Qualitätsänderungen und Lagerplätze für ALLE sechs Listen löschen?')){state={};save();render()}};
render();
</script></body></html>
